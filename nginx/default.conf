server {
  listen 80;
  server_name ch-chang.yssnooker.com neverdie.yssnooker.com om.yssnooker.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name ch-chang.yssnooker.com;

  ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /api/uploads/ {
    alias /srv/uploads/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location /api/ {
    proxy_pass http://golang-demo1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api-key/ {
    proxy_pass http://165.232.161.93:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name neverdie.yssnooker.com;

  ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /api/uploads/ {
    alias /srv/uploads/neverdie/;
    access_log off;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://golang-neverdie:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api-key/ {
    proxy_pass http://165.232.161.93:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name om.yssnooker.com;

  ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://golang-demo1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}