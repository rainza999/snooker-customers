resolver 127.0.0.11 ipv6=off valid=30s;

map $host $backend_upstream {
  default           http://${BACKEND_DEFAULT}:8000;
  ${CH_CHANG_HOST} http://${BACKEND_CH_CHANG}:8000;
  ${NEVERDIE_HOST} http://${BACKEND_NEVERDIE}:8000;
  ${OM_HOST}       http://${BACKEND_OM}:8000;
  ${SITE4_HOST}    http://${BACKEND_SITE4}:8000;
}

map $host $upload_root {
  default           ${UPLOAD_ROOT_DEFAULT};
  ${CH_CHANG_HOST} ${UPLOAD_ROOT_CH_CHANG};
  ${NEVERDIE_HOST} ${UPLOAD_ROOT_NEVERDIE};
  ${OM_HOST}       ${UPLOAD_ROOT_OM};
  ${SITE4_HOST}    ${UPLOAD_ROOT_SITE4};
}

map $host $upload_cache_control {
  default           "public, max-age=604800, immutable";
  ${CH_CHANG_HOST} "public, max-age=604800, immutable";
  ${NEVERDIE_HOST} "no-cache, no-store, must-revalidate";
  ${OM_HOST}       "public, max-age=604800, immutable";
  ${SITE4_HOST}    "public, max-age=604800, immutable";
}

map $host $upload_expires {
  default           7d;
  ${CH_CHANG_HOST} 7d;
  ${NEVERDIE_HOST} off;
  ${OM_HOST}       7d;
  ${SITE4_HOST}    7d;
}

server {
  listen 80;
  server_name localhost ${CH_CHANG_HOST} ${NEVERDIE_HOST} ${OM_HOST} ${SITE4_HOST};

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /api/uploads/ {
    rewrite ^/api/uploads/(.*)$ /$1 break;
    root $upload_root;
    access_log off;
    expires $upload_expires;
    add_header Cache-Control $upload_cache_control always;
    try_files $uri =404;
  }

  location = /api/point-of-sales/events {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api-key/ {
    rewrite ^/api-key/(.*)$ /$1 break;
    proxy_pass http://165.232.161.93:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
