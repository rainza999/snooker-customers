resolver 127.0.0.11 ipv6=off valid=30s;

map $host $backend_upstream {
  default       http://${BACKEND_DEMO1}:8000;
  ${DEMO1_HOST} http://${BACKEND_DEMO1}:8000;
  ${DEMO2_HOST} http://${BACKEND_DEMO2}:8000;
  ${DEMO3_HOST} http://${BACKEND_DEMO3}:8000;
  ${DEMO4_HOST} http://${BACKEND_DEMO4}:8000;
}

map $host $upload_root {
  default       ${UPLOAD_ROOT_DEMO1};
  ${DEMO1_HOST} ${UPLOAD_ROOT_DEMO1};
  ${DEMO2_HOST} ${UPLOAD_ROOT_DEMO2};
  ${DEMO3_HOST} ${UPLOAD_ROOT_DEMO3};
  ${DEMO4_HOST} ${UPLOAD_ROOT_DEMO4};
}

server {
  listen 80;
  server_name ${DEMO1_HOST} ${DEMO2_HOST} ${DEMO3_HOST} ${DEMO4_HOST};
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name ${DEMO1_HOST} ${DEMO2_HOST} ${DEMO3_HOST} ${DEMO4_HOST};

  ssl_certificate     /etc/nginx/ssl/live/yssnooker.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/yssnooker.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /api/uploads/ {
    rewrite ^/api/uploads/(.*)$ /$1 break;
    root $upload_root;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    try_files $uri =404;
  }

  location = /api/point-of-sales/events {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api-key/ {
    rewrite ^/api-key/(.*)$ /$1 break;
    proxy_pass http://165.232.161.93:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
